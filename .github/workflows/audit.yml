name: Verify in-place SmartNotifications fake toggle patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit.yml'
      - 'scripts/patch_fake_inline.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify original file layout, hook keys and branch targets
        run: |
          set -euo pipefail
          python3 -m pip install -q capstone keystone-engine
          mkdir -p extracted
          dpkg-deb -x input/smartnotificationsios16_v1.0_iphoneos-arm64.deb extracted
          python3 scripts/patch_fake_inline.py extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/SmartNotificationsiOS16.dylib /tmp/out --dry-run
