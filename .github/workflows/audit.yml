name: Audit SmartNotifications binary and switches

on:
  push:
    paths:
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled DEB and preference keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/pkg
          dpkg-deb -R input/smartnotificationsios16_v1.0_iphoneos-arm64.deb audit/pkg
          echo '==== ALL FILES ===='
          find audit/pkg -type f -printf '%p %s bytes\n' | sort
          echo '==== MACHO LIBRARIES ===='
          find audit/pkg -type f \( -name '*.dylib' -o -name '*.bundle' -o -name '*.appex' \) -print
          echo '==== PREFERENCE DATA AND TOGGLE LABELS ===='
          python3 - <<'PY'
          import os, plistlib
          for root, dirs, files in os.walk('audit/pkg'):
              for fn in files:
                  p=os.path.join(root,fn)
                  if fn.endswith('.plist'):
                      try:
                          with open(p,'rb') as f: x=plistlib.load(f)
                          print('\nFILE:',p, '\n',str(x)[:16000])
                      except Exception as e: print('plist error',p,str(e))
          PY
          echo '==== NOTIFICATION STRINGS PER DYLIB/EXE ===='
          find audit/pkg -type f -size +20k | while read -r file; do
            if file "$file" | grep -qiE 'Mach-O|binary|data'; then
              echo ">>> $file"
              strings -a -t x "$file" | grep -Ei -C 2 'fakenoti|fakenotification|fake.?notification|silent.?mode|forcesound|sound.?enabled|enabled.?sound|swipe|respring|snooze|no.?sender|remove.?manage|block.?word|enable|prefs|notify' | head -n 470 || true
            fi
          done
          echo '==== CONTROL / FILTER BUNDLE DATA ===='
          find audit/pkg -type f \( -name '*.plist' -o -name '*.strings' \) -printf '%p\n' | head -n 200
