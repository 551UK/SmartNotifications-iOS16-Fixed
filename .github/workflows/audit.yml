name: Inspect SmartNotifications toggle and runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode original compiled toggle code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/pkg
          dpkg-deb -R input/smartnotificationsios16_v1.0_iphoneos-arm64.deb audit/pkg
          python3 -m pip install -q lief capstone
          python3 scripts/inspect_toggle.py
